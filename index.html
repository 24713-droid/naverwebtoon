<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 감성 국어 멘토 | 문학적 성찰의 시간</title>
  
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --primary-color: #2c3e50;
      --accent-color: #e67e22;
      --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
    }

    * { box-sizing: border-box; font-family: 'Malgun Gothic', sans-serif; }

    body {
      margin: 0; min-height: 100vh;
      background: var(--bg-gradient);
      display: flex; flex-direction: column; align-items: center;
      padding: 20px;
    }

    .container {
      width: min(900px, 95%);
      background: rgba(255, 255, 255, 0.98);
      border-radius: 24px;
      padding: 35px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.12);
    }

    .header {
      text-align: center; border-bottom: 2px solid #edf1f5;
      padding-bottom: 20px; margin-bottom: 25px;
    }
    h1 { color: var(--primary-color); margin: 0 0 8px; font-size: 26px; }
    .subtitle { color: #777; font-size: 14px; margin: 0; }

    /* 이메일 로그인 영역 스타일 */
    .auth-section {
      background: #f8f9fa; border-radius: 16px; padding: 20px;
      margin-bottom: 25px; border: 1px solid #e9ecef;
    }
    .auth-inputs { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
    .auth-inputs input {
      flex: 1; min-width: 200px; height: 42px; padding: 0 12px;
      border: 1px solid #ddd; border-radius: 8px; font-size: 14px; outline: none;
    }
    .auth-inputs input:focus { border-color: var(--accent-color); }
    
    .user-info-box {
      display: none; justify-content: space-between; align-items: center;
      background: #e8f5e9; color: #2e7d32; padding: 12px 20px;
      border-radius: 12px; font-weight: bold; font-size: 14px;
    }

    /* 메인 앱 콘텐츠 영역 */
    .main-content { display: none; flex-direction: column; gap: 20px; }
    .lock-notice { text-align: center; color: #999; padding: 40px 0; font-weight: bold; }

    textarea {
      width: 100%; min-height: 120px; padding: 16px; resize: vertical;
      border: 1px solid #ddd; border-radius: 16px; font-size: 16px; line-height: 1.5; outline: none;
    }
    textarea:focus { border-color: #42a5f5; box-shadow: 0 0 0 3px rgba(66, 165, 245, 0.15); }

    .button-row { display: flex; gap: 10px; justify-content: flex-end; }
    button {
      border: none; border-radius: 10px; padding: 0 18px; height: 44px;
      font-size: 14px; cursor: pointer; transition: 0.15s; font-weight: bold;
    }
    button:hover { transform: translateY(-1px); opacity: 0.9; }
    .btn-primary { background: var(--accent-color); color: white; }
    .btn-secondary { background: #b0bec5; color: white; }
    .btn-dark { background: #34495e; color: white; }

    /* 결과창 */
    .result-box {
      min-height: 180px; padding: 20px; border-radius: 16px;
      background: #f7f9fb; border: 1px solid #edf1f5; line-height: 1.7;
      white-space: pre-wrap; word-break: break-word; margin-top: 10px;
    }
    .result-label { font-weight: bold; color: var(--accent-color); margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center;}

    /* 기록장 */
    .history-section { margin-top: 30px; border-top: 2px solid #edf1f5; padding-top: 20px; }
    .history-card {
      background: #fff; border: 1px solid #e9ecef; padding: 15px;
      border-radius: 12px; margin-bottom: 10px; font-size: 13px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.02);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>📚 AI 감성 국어 멘토</h1>
      <p class="subtitle">문장 속 감정을 분석하고, 마음에 스미는 우리말과 시 구절을 처방합니다.</p>
    </div>

    <div class="auth-section">
      <div id="authForm">
        <div style="font-weight: bold; margin-bottom: 8px; font-size: 14px; color: #555;">🔐 수행평가 시연용 로그인 / 회원가입</div>
        <div class="auth-inputs">
          <input type="email" id="authEmail" placeholder="이메일 주소 입력" />
          <input type="password" id="authPassword" placeholder="비밀번호 입력" />
        </div>
        <div class="button-row" style="justify-content: flex-start;">
          <button class="btn-dark" onclick="handleLogin()">이메일 로그인</button>
          <button class="btn-secondary" onclick="handleRegister()">간편 회원가입</button>
        </div>
      </div>
      
      <div id="userInfoBox" class="user-info-box">
        <span>👋 <span id="userEmailDisplay"></span>님 환영합니다! 나만의 문학 멘토링 방이 활성화되었습니다.</span>
        <button class="btn-secondary" style="height: 32px; padding: 0 12px; font-size: 12px;" onclick="handleLogout()">로그아웃</button>
      </div>
    </div>

    <div id="lockNotice" class="lock-notice">
      🔒 위 가입처에서 로그인하시면 AI 멘토링 서비스를 이용할 수 있습니다.
    </div>

    <div id="mainContent" class="main-content">
      <div>
        <div style="font-weight: bold; margin-bottom: 6px;">✍️ 오늘의 감정 문장 입력</div>
        <textarea id="questionInput" placeholder="오늘의 기분이나 생각나는 문장을 적어보세요. (예: 요즘 시험 공부 때문에 너무 지치고 무기력해.)"></textarea>
      </div>

      <div class="button-row">
        <button class="btn-secondary" onclick="clearPage()">초기화</button>
        <button class="btn-primary" id="askBtn" onclick="askChatGPT()">감성 분석 및 멘토링 요청</button>
      </div>

      <div id="status" style="font-size: 13px; color: #667085; min-height: 20px;"></div>

      <div>
        <div class="result-label">
          <span>✨ AI 문학 멘토의 정서 처방전</span>
          <button class="btn-dark" id="ttsBtn" style="height:32px; padding:0 12px; font-size:12px; display:none;" onclick="playTTS()">🔊 음성으로 듣기</button>
        </div>
        <div id="answerBox" class="result-box">아직 분석 요청이 없습니다. 문장을 입력하고 버튼을 눌러보세요.</div>
      </div>

      <div class="history-section">
        <h3 style="font-size: 16px; margin: 0 0 12px 0; color: var(--primary-color);">📖 나의 문학 감성 기록장 (최근 3개)</h3>
        <div id="historyList">
          <p style="color:#999; font-size:13px;">기록을 불러오는 중입니다...</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    // [필수수정] 본인의 Firebase 웹 앱 SDK 설정값으로 반드시 교체하세요!
    const firebaseConfig = {
      apiKey: "AIzaSy...",
      authDomain: "your-project.firebaseapp.com",
      projectId: "your-project",
      storageBucket: "your-project.appspot.com",
      messagingSenderId: "...",
      appId: "..."
    };
    
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // 기존에 생성해서 사용하시던 구글 Apps Script 웹 앱 URL 주소입니다. 그대로 작동합니다.
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyTS-n6dNxhXGHxck-BL97z9l2PPrqZbl0tqjtPIP44MVFtyOiTwizk4jva8GMuV38p/exec';

    let currentUser = null;

    /* =======================================================
       1. Authentication (이메일/비밀번호 가입 및 로그인 제어)
       ======================================================= */
    async function handleRegister() {
      const email = document.getElementById('authEmail').value.trim();
      const password = document.getElementById('authPassword').value.trim();
      if(!email || !password) return alert('이메일과 비밀번호를 입력해주세요.');
      if(password.length < 6) return alert('비밀번호는 보안상 6자리 이상이어야 합니다.');

      try {
        await auth.createUserWithEmailAndPassword(email, password);
        alert('간편 회원가입이 완료되어 자동으로 로그인되었습니다!');
      } catch(error) {
        alert('가입 실패 원인: ' + error.message);
      }
    }

    async function handleLogin() {
      const email = document.getElementById('authEmail').value.trim();
      const password = document.getElementById('authPassword').value.trim();
      if(!email || !password) return alert('이메일과 비밀번호를 입력해주세요.');

      try {
        await auth.signInWithEmailAndPassword(email, password);
      } catch(error) {
        alert('로그인 실패 원인: ' + error.message);
      }
    }

    function handleLogout() {
      auth.signOut();
      alert('로그아웃 되었습니다.');
    }

    // 유저 로그인 상태 변화를 실시간으로 체크하여 화면을 열고 닫는 감시자 함수
    auth.onAuthStateChanged((user) => {
      currentUser = user;
      const authForm = document.getElementById('authForm');
      const userInfoBox = document.getElementById('userInfoBox');
      const lockNotice = document.getElementById('lockNotice');
      const mainContent = document.getElementById('mainContent');

      if (user) {
        // 로그인 성공 시 UI 변환
        authForm.style.display = 'none';
        userInfoBox.style.display = 'flex';
        lockNotice.style.display = 'none';
        mainContent.style.display = 'flex';
        document.getElementById('userEmailDisplay').textContent = user.email;
        loadHistory(); // 유저별 DB 기록 로드
      } else {
        // 로그아웃 상태 UI 변환
        authForm.style.display = 'block';
        userInfoBox.style.display = 'none';
        lockNotice.style.display = 'block';
        mainContent.style.display = 'none';
        document.getElementById('authEmail').value = '';
        document.getElementById('authPassword').value = '';
      }
    });

    /* =======================================================
       2. Generative AI 연동 (생성형 인공지능 국어 모드 프롬프트)
       ======================================================= */
    async function askChatGPT() {
      const question = document.getElementById('questionInput').value.trim();
      if (!question) return alert('정서를 분석할 문장을 입력해주세요.');

      // 진로 융합형 하드코딩 프롬프트 구성 (국어국문학 가치 가이드)
      const literaryPrompt = `[국어국문학 정서 멘토 프로토콜]
      사용자가 작성한 문장: "${question}"
      
      너는 다정한 언어학자이자 시인이야. 다음 양식에 맞춰 한글로 답변해줘:
      1. 문장 속에 담긴 화자의 감정 형태 요약 분석 (예: 불안, 외로움, 무기력 등)
      2. 이 감정을 따스하게 위로하거나 대변해주는 아름다운 '순우리말 단어' 하나 제안 및 의미 설명
      3. 이 정서와 어울리는 한국 현대시의 유명한 '시 한 구절' 추천 및 응원의 한마디 문학적으로 작성하기.`;

      try {
        setLoading(true);
        document.getElementById('answerBox').textContent = 'AI 문학 멘토가 문장을 심도 있게 분석 중입니다...';
        document.getElementById('status').textContent = 'Apps Script 인공지능 허브와 안전하게 통신하고 있습니다.';
        document.getElementById('ttsBtn').style.display = 'none';

        const response = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({ question: literaryPrompt })
        });

        const data = await response.json();
        if (data.error) throw new Error(data.error);

        const aiAnswer = data.answer || '답변 전달 체계에 오류가 발생했습니다.';
        document.getElementById('answerBox').textContent = aiAnswer;
        document.getElementById('status').textContent = '감성 분석 및 표현 처방 완료';
        document.getElementById('ttsBtn').style.display = 'block';

        // 4. Firestore DB에 데이터 누적 보관
        await saveToFirestore(question, aiAnswer);

      } catch (error) {
        console.error(error);
        document.getElementById('answerBox').textContent = '오류가 발생했습니다.\n\n' + error.message;
        document.getElementById('status').textContent = '요청 처리 실패';
      } finally {
        setLoading(false);
      }
    }

    function setLoading(isLoading) {
      const askBtn = document.getElementById('askBtn');
      askBtn.disabled = isLoading;
      askBtn.textContent = isLoading ? '정서 분석 중...' : '감성 분석 및 멘토링 요청';
    }

    /* =======================================================
       3. TTS (Text-to-Speech) Web Speech API 연동
       ======================================================= */
    function playTTS() {
      const text = document.getElementById('answerBox').textContent;
      if (!text || text.startsWith('아직 분석')) return;

      if (window.speechSynthesis.speaking) {
        window.speechSynthesis.cancel();
        document.getElementById('ttsBtn').textContent = "🔊 음성으로 듣기";
      } else {
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'ko-KR';
        utterance.rate = 0.95; // 문학적인 느낌을 살려 살짝 여유 있는 속도로 설정
        
        utterance.onend = () => {
          document.getElementById('ttsBtn').textContent = "🔊 음성으로 듣기";
        };
        
        document.getElementById('ttsBtn').textContent = "⏹️ 낭독 중지하기";
        window.speechSynthesis.speak(utterance);
      }
    }

    /* =======================================================
       4. Firestore Database 연동 (유저 데이터 실시간 CRUD)
       ======================================================= */
    async function saveToFirestore(userQuestion, aiAnswer) {
      if(!currentUser) return;
      try {
        await db.collection("literary_logs").add({
          userEmail: currentUser.email,
          uid: currentUser.uid,
          question: userQuestion,
          answer: aiAnswer,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        loadHistory(); // 리스트 즉시 리프레시
      } catch(e) {
        console.error("Firestore 저장 에러:", e);
      }
    }

    async function loadHistory() {
      if(!currentUser) return;
      try {
        const snapshot = await db.collection("literary_logs")
          .where("uid", "==", currentUser.uid)
          .orderBy("createdAt", "desc")
          .limit(3) // 발표용이므로 복잡하지 않게 최신 3개만 매핑
          .get();

        const historyList = document.getElementById('historyList');
        if(snapshot.empty) {
          historyList.innerHTML = `<p style="color:#999; font-size:13px;">아직 기록장이 비어 있습니다. 첫 감성 분석을 시도해 보세요!</p>`;
          return;
        }

        let html = "";
        snapshot.forEach(doc => {
          const data = doc.data();
          const time = data.createdAt ? new Date(data.createdAt.toDate()).toLocaleString() : "방금 전";
          html += `
            <div class="history-card">
              <div style="font-weight:bold; color:var(--primary-color); margin-bottom:4px;">💬 내 문장: "${data.question}"</div>
              <div style="color:#555; white-space:pre-wrap; font-size:12.5px; background:#fcfcfc; padding:10px; border-radius:8px; margin-top:5px; border-left:3px solid #ccc;">${data.answer.substring(0, 180)}...</div>
              <div style="text-align:right; font-size:11px; color:#aaa; margin-top:6px;">⏱️ 기록 시각: ${time}</div>
            </div>
          `;
        });
        historyList.innerHTML = html;
      } catch(e) {
        console.error("Firestore 읽기 에러:", e);
        document.getElementById('historyList').innerHTML = `<p style="color:red; font-size:13px;">기록 로드 실패: ${e.message}</p>`;
      }
    }

    function clearPage() {
      document.getElementById('questionInput').value = '';
      document.getElementById('answerBox').textContent = '아직 답변이 없습니다.';
      document.getElementById('status').textContent = '';
      document.getElementById('ttsBtn').style.display = 'none';
      if(window.speechSynthesis.speaking) window.speechSynthesis.cancel();
    }
  </script>
</body>
</html>
