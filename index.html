<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 감성 국어 멘토 | 문학적 성찰의 시간</title>
  
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --primary-color: #2c3e50;
      --accent-color: #e67e22;
      --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
    }

    * { box-sizing: border-box; font-family: 'Pretendard', 'Malgun Gothic', sans-serif; }

    body {
      margin: 0; min-height: 100vh;
      background: var(--bg-gradient);
      display: flex; flex-direction: column; align-items: center;
      padding: 20px;
    }

    .container {
      width: min(1000px, 95%);
      background: rgba(255, 255, 255, 0.95);
      border-radius: 30px;
      padding: 40px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.1);
    }

    /* Auth Section */
    .auth-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 30px; padding-bottom: 20px; border-bottom: 2px solid #eee;
    }
    .user-info { display: none; align-items: center; gap: 10px; }
    .user-info img { width: 40px; border-radius: 50%; }

    h1 { color: var(--primary-color); margin: 0; font-size: 24px; }
    .intro-text { color: #666; font-size: 14px; margin-top: 10px; }

    /* Input Area */
    .input-section { margin-top: 30px; display: flex; flex-direction: column; gap: 15px; }
    textarea {
      width: 100%; min-height: 120px; padding: 20px;
      border: 2px solid #e0e0e0; border-radius: 20px;
      font-size: 16px; outline: none; transition: 0.3s;
    }
    textarea:focus { border-color: var(--accent-color); }

    .btn-group { display: flex; gap: 10px; justify-content: flex-end; }
    button {
      padding: 12px 25px; border-radius: 15px; border: none;
      cursor: pointer; font-weight: bold; transition: 0.2s;
    }
    .login-btn { background: var(--primary-color); color: white; }
    .ask-btn { background: var(--accent-color); color: white; display: none; }
    .speak-btn { background: #34495e; color: white; display: none; }
    button:hover { transform: translateY(-2px); opacity: 0.9; }

    /* Result Area */
    .result-section {
      margin-top: 30px; padding: 25px;
      background: #fff; border-left: 5px solid var(--accent-color);
      border-radius: 15px; display: none;
    }
    .result-title { font-weight: bold; color: var(--accent-color); margin-bottom: 10px; }
    .result-content { line-height: 1.8; color: #333; white-space: pre-wrap; }

    /* History (Firebase Database) */
    .history-section { margin-top: 40px; }
    .history-card {
      background: white; padding: 15px; border-radius: 15px;
      margin-bottom: 10px; font-size: 14px; box-shadow: 0 5px 15px rgba(0,0,0,0.05);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="auth-header">
      <h1>📚 AI 감성 국어 멘토</h1>
      <div id="authContainer">
        <button class="login-btn" id="loginBtn" onclick="handleAuth()">Google 로그인</button>
      </div>
      <div class="user-info" id="userInfo">
        <img id="userPhoto" src="" alt="user">
        <span id="userName"></span>
        <button onclick="handleLogout()" style="font-size: 11px;">로그아웃</button>
      </div>
    </div>

    <p class="intro-text">문장 속 숨은 감정을 찾고, 아름다운 문학적 표현으로 재해석해 드립니다.</p>

    <div class="input-section">
      <textarea id="questionInput" placeholder="오늘의 감정이나 생각나는 문장을 입력해보세요..."></textarea>
      <div class="btn-group">
        <button class="speak-btn" id="speakBtn" onclick="toggleSpeak()">🔊 들으면서 읽기</button>
        <button class="ask-btn" id="askBtn" onclick="askChatGPT()">감성 분석 및 멘토링</button>
      </div>
    </div>

    <div id="status" style="font-size: 12px; color: #999; margin-top: 10px;"></div>

    <div class="result-section" id="resultSection">
      <div class="result-title">✨ AI 문학 멘토의 성찰</div>
      <div class="result-content" id="answerBox"></div>
    </div>

    <div class="history-section">
      <h3 style="font-size: 16px;">나의 문학 기록장</h3>
      <div id="historyList"></div>
    </div>
  </div>

  <script>
    // 1. Firebase 설정 (본인의 Config로 교체 필수)
    const firebaseConfig = {
      apiKey: "AIzaSy...",
      authDomain: "your-project.firebaseapp.com",
      projectId: "your-project",
      storageBucket: "your-project.appspot.com",
      messagingSenderId: "...",
      appId: "..."
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    const APPS_SCRIPT_URL = '여기에_GAS_URL_입력';

    let currentUser = null;

    // 2. 인증 관리 (Authentication)
    function handleAuth() {
      const provider = new firebase.auth.GoogleAuthProvider();
      auth.signInWithPopup(provider);
    }

    function handleLogout() {
      auth.signOut();
    }

    auth.onAuthStateChanged((user) => {
      currentUser = user;
      if (user) {
        document.getElementById('loginBtn').style.display = 'none';
        document.getElementById('userInfo').style.display = 'flex';
        document.getElementById('askBtn').style.display = 'block';
        document.getElementById('userName').textContent = user.displayName;
        document.getElementById('userPhoto').src = user.photoURL;
        loadHistory();
      } else {
        document.getElementById('loginBtn').style.display = 'block';
        document.getElementById('userInfo').style.display = 'none';
        document.getElementById('askBtn').style.display = 'none';
        document.getElementById('historyList').innerHTML = "로그인 후 기록을 확인하세요.";
      }
    });

    // 3. AI 연동 (API + Prompt)
    async function askChatGPT() {
      const question = document.getElementById('questionInput').value.trim();
      if (!question) return alert("문장을 입력하세요.");

      setLoading(true);
      
      // 진로 맞춤형 프롬프트 주입 (GAS에서 처리해도 되지만 클라이언트에서 가이드 가능)
      const prompt = `[국어국문학 전문가 모드] 다음 문장을 분석해줘: "${question}". 
      1.문장의 감정을 분석하고 2.이와 어울리는 아름다운 우리말 단어나 시 구절을 추천해줘.`;

      try {
        const response = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({ question: prompt })
        });
        const data = await response.json();
        const answer = data.answer;

        displayResult(answer);
        saveHistory(question, answer); // DB 저장
      } catch (e) {
        console.error(e);
        alert("분석 중 오류가 발생했습니다.");
      } finally {
        setLoading(false);
      }
    }

    function displayResult(answer) {
      const section = document.getElementById('resultSection');
      const box = document.getElementById('answerBox');
      const speakBtn = document.getElementById('speakBtn');
      
      section.style.display = 'block';
      box.textContent = answer;
      speakBtn.style.display = 'block';
    }

    // 4. TTS 기능 (Web Speech API)
    function toggleSpeak() {
      const text = document.getElementById('answerBox').textContent;
      if (window.speechSynthesis.speaking) {
        window.speechSynthesis.cancel();
      } else {
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'ko-KR';
        msg.rate = 0.9; // 조금 천천히 문학적인 느낌으로
        window.speechSynthesis.speak(msg);
      }
    }

    // 5. 데이터 저장 (Firestore Database)
    async function saveHistory(q, a) {
      if (!currentUser) return;
      await db.collection("literary_logs").add({
        uid: currentUser.uid,
        question: q,
        answer: a,
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
      });
      loadHistory();
    }

    async function loadHistory() {
      if (!currentUser) return;
      const snapshot = await db.collection("literary_logs")
        .where("uid", "==", currentUser.uid)
        .orderBy("timestamp", "desc")
        .limit(5)
        .get();
      
      const list = document.getElementById('historyList');
      list.innerHTML = "";
      snapshot.forEach(doc => {
        const data = doc.data();
        list.innerHTML += `
          <div class="history-card">
            <strong>질문:</strong> ${data.question.substring(0, 30)}... <br>
            <small>${new Date(data.timestamp?.toDate()).toLocaleString()}</small>
          </div>`;
      });
    }

    function setLoading(isLoading) {
      const btn = document.getElementById('askBtn');
      btn.disabled = isLoading;
      btn.textContent = isLoading ? "멘토가 생각하는 중..." : "감성 분석 및 멘토링";
    }
  </script>
</body>
</html>
